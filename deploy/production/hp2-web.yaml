apiVersion: apps/v1
kind: Deployment
metadata:
  name: hp2-web
  labels:
    app.kubernetes.io/name: hp2-web
    app.kubernetes.io/part-of: mihaimateias
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hp2-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hp2-web
        app.kubernetes.io/part-of: mihaimateias
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hp2-web
          image: ghcr.io/cefege/hp2-web
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hp2-web
  labels:
    app.kubernetes.io/name: hp2-web
    app.kubernetes.io/part-of: mihaimateias
spec:
  selector:
    app.kubernetes.io/name: hp2-web
  ports:
    - name: http
      port: 8080
      targetPort: http
