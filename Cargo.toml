[package]
name = "mihaimateias"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.7.10", features = ["router", "fullstack"] }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
